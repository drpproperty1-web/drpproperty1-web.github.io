<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRPCOM - Global Property Owner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f4f6f9;color:#111}
header{background:#0b1e3a;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:22px;letter-spacing:1px}
.btn{padding:10px 16px;border:0;border-radius:8px;font-weight:700;cursor:pointer}
.btn-gold{background:#f5c542;color:#000}
.btn-blue{background:#0b1e3a;color:#fff}
.wrap{max-width:1100px;margin:auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.08);margin-bottom:16px}
.input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;margin-top:8px}
.badge{display:inline-block;background:#eef2ff;color:#0b1e3a;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;margin-right:6px}
.post{border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:14px}
.post .head{padding:12px 14px;background:#f9fafb;display:flex;justify-content:space-between}
.post .body{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.hidden{display:none}
</style>
</head>
<body>
<header>
<div class="logo">DRPCOM.CO.IN - GLOBAL</div>
<button id="topIdBtn" class="btn btn-gold" onclick="document.getElementById('ownerBox').scrollIntoView()">MY GLOBAL ID</button>
</header>
<div class="wrap">
 <div id="ownerBox" class="card">
<h2>🌍 Global Owner ID - Only DRP</h2>
<p style="margin-top:6px;color:#555">Free Global ID - Property Bechne Ke Liye Post Karo - Worldwide</p>
<input id="oName" class="input" placeholder="Apna Naam - Hidden Rahega">
<input id="oCity" class="input" placeholder="Apni City - Worldwide">
<input id="oPhone" class="input" placeholder="WhatsApp Number - Private">
<button class="btn btn-blue" style="margin-top:12px;width:100%" onclick="makeId()">Generate My Global ID</button>
<div id="idResult" class="hidden" style="margin-top:14px;padding:12px;background:#f0fdf4;border:1px dashed #22c55e;border-radius:10px">
<div>Your Global ID: <b id="showId"></b></div>
<div style="margin-top:6px"><span class="badge">ONLY DRP NAME</span><span class="badge">HIDDEN MALIK</span><span class="badge">GLOBAL REACH</span></div>
</div>
</div>

<div class="card">
<h3>Post Your Global Property</h3>
<input id="pTitle" class="input" placeholder="Property Title - Ex: Global Building">
<input id="pLoc" class="input" placeholder="Location - Ex: Worldwide - Any Country">
<input id="pPrice" class="input" placeholder="Price - Ex: $500k - Global">
<textarea id="pDesc" class="input" rows="3" placeholder="Detail - Language + All Language"></textarea>
<button class="btn btn-gold" style="margin-top:12px;width:100%" onclick="doPost()">POST GLOBAL - 1000x Reach</button>
</div>
<div class="card">
<h3>🌍 Global Properties - Worldwide</h3>
<div id="posts" class="grid" style="margin-top:12px"></div>
</div>
</div>

<script>
let cur=null;
let posts=JSON.parse(localStorage.getItem('drp_global_posts')||'[]');

function makeId(){
let n=document.getElementById('oName').value||'Owner';
let c=document.getElementById('oCity').value||'Global';
let p=document.getElementById('oPhone').value||'000';
let id='DRP-OWNER-'+Math.floor(1000+Math.random()*9000);
cur={name:n,city:c,phone:p,id:id};
localStorage.setItem('drp_global_user',JSON.stringify(cur));
document.getElementById('showId').innerText=id;
document.getElementById('idResult').classList.remove('hidden');
document.getElementById('topIdBtn').innerText=id;
alert('Global ID Ban Gaya: '+id);
}

function doPost(){
let t=document.getElementById('pTitle').value||'Global Building - Worldwide';
let l=document.getElementById('pLoc').value||'Global - Worldwide';
let pr=document.getElementById('pPrice').value||'$500k - Global';
let d=document.getElementById('pDesc').value||'Global Building - Worldwide - Owner Post - Location + All Language + Global Reach 1000x - Only DRP Name - Hidden Malik';
let obj={id:Date.now(),title:t,location:l,price:pr,desc:d,owner:cur?cur.id:'DRP-OWNER-0001'};
posts.unshift(obj);
localStorage.setItem('drp_global_posts',JSON.stringify(posts));
render();
document.getElementById('pTitle').value='';document.getElementById('pLoc').value='';document.getElementById('pPrice').value='';document.getElementById('pDesc').value='';
}
function render(){
let box=document.getElementById('posts');
if(posts.length==0){
box.innerHTML='<div class="card">No Global Post Yet - First Post Karo</div>';
return;
}
box.innerHTML=posts.map(p=>`
<div class="post">
<div class="head"><b>${p.title}</b><span class="badge">${p.price}</span></div>
<div class="body">
<div style="color:#555;font-size:13px">${p.location} | ${p.owner}</div>
<div style="margin-top:8px">${p.desc}</div>
<div style="margin-top:10px"><span class="badge">ONLY DRP</span><span class="badge">HIDDEN MALIK</span><span class="badge">1000x GLOBAL</span></div>
<button class="btn btn-blue" style="margin-top:10px;width:100%" onclick="contactOwner('${p.owner}')">Contact Owner - Global ID</button>
</div>
</div>
`).join('');
}

function contactOwner(id){
let u=cur?cur.id:'Guest';
alert('Contact via Global ID: '+id+'\nYour ID: '+u+'\nOwner detail hidden - Only DRP visible - Worldwide System');
}

(function init(){
let saved=localStorage.getItem('drp_global_user');
if(saved){cur=JSON.parse(saved);document.getElementById('topIdBtn').innerText=cur.id;document.getElementById('showId').innerText=cur.id;document.getElementById('idResult').classList.remove('hidden');}
 if(posts.length==0){
posts=[{id:1,title:'Global Building - Worldwide',location:'Worldwide - Any Country - Global',price:'$500k - Global',desc:'🌍 Global Building - Worldwide - Owner Post - Location + All Language + Global Reach 1000x - Only DRP Name - Hidden Malik',owner:'DRP-OWNER-0001'}];
}
render();
})();
</script>
</body>
</html>
