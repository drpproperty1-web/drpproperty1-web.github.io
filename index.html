<!-- PROFILE CLICKABLE + DP UPLOAD + POST MEDIA -->
<script>
// Extra functions add karo old code me
function openProfileSettings(){
 let name=prompt('Apna Naam likho:', currentUser.uname);
 if(name) { currentUser.uname=name; localStorage.setItem(LS_USER, JSON.stringify(currentUser)); showMain(); }
}
function uploadDP(){
 let input=document.createElement('input'); input.type='file'; input.accept='image/*';
 input.onchange=e=>{
  let reader=new FileReader();
  reader.onload=ev=>{
   localStorage.setItem('drp_dp_'+currentUser.uname, ev.target.result);
   document.getElementById('pPhoto').innerHTML=`<img src="${ev.target.result}" style="width:60px;height:60px;border-radius:50%;object-fit:cover">`;
  }; reader.readAsDataURL(e.target.files[0]);
 }; input.click();
}
</script>
