<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drpcom.co.in - India's Most Trusted Property Brand</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',Arial}
body{background:#000;color:#fff}
.header{position:sticky;top:0;z-index:99;background:rgba(0,0,0,.9);backdrop-filter:blur(20px);border-bottom:1px solid #222;padding:10px 14px;display:flex;align-items:center;gap:12px}
.logo{font-weight:900;font-size:24px;background:linear-gradient(90deg,#43e97b,#38f9d7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo span{font-size:10px;background:#fff;color:#000;padding:3px 8px;border-radius:20px;-webkit-text-fill-color:#000;margin-left:6px}
.search{flex:1;display:flex;max-width:700px;background:rgba(255,255,255,.1);border:1px solid #333;border-radius:28px;padding:4px 6px 4px 16px}
.search input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:14px}
.search button{background:#fff;color:#000;border:none;padding:10px 20px;border-radius:20px;font-weight:900;cursor:pointer}
.bar{background:linear-gradient(90deg,#667eea,#764ba2);text-align:center;padding:6px;font-size:11px;font-weight:700}
.bar a{color:#FFD814;text-decoration:none}
.chips{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;background:#0a0a0a;border-bottom:1px solid #222}
.chip{padding:8px 14px;background:rgba(255,255,255,.08);border:1px solid #333;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer}
.chip:hover{background:#fff;color:#000}
.main{display:flex;gap:12px;max-width:1500px;margin:auto;padding:12px}
.left{width:320px}
@media(max-width:1100px){.left{width:100%}}
.center{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.card{background:rgba(255,255,255,.06);border:1px solid #222;border-radius:16px;padding:14px;margin-bottom:12px}
.pcard{background:#111;border:1px solid #222;border-radius:16px;overflow:hidden}
.pcard img{width:100%;height:200px;object-fit:cover}
.pbody{padding:12px}
.price{font-size:18px;font-weight:900}
.social{display:flex;gap:6px;margin-top:8px}
.social a{flex:1;padding:8px;text-align:center;border-radius:8px;color:#fff;text-decoration:none;font-weight:800;font-size:11px}
.btn{width:100%;padding:12px;border-radius:10px;text-align:center;font-weight:900;font-size:12px;text-decoration:none;display:block;margin-top:8px;cursor:pointer;border:none}
.btnW{background:#fff;color:#000}.btnY{background:#FFD814;color:#000}.btnG{background:#25D366;color:#fff}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(20px);z-index:999;padding:20px;overflow:auto}
.modalBox{background:#111;border:1px solid #333;max-width:500px;margin:30px auto;padding:20px;border-radius:20px}
.inp{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:rgba(255,255,255,.08);color:#fff;outline:none}
.footer{background:#080808;border-top:1px solid #222;padding:20px;text-align:center;font-size:11px;line-height:2;opacity:.8}
.footer a{color:#FFD814;text-decoration:none;font-weight:800}
</style>
</head>
<body>

<div class="header">
<div class="logo">Drpcom.co.in <span>NO.1</span></div>
<div class="search"><input id="sInput" placeholder="Search Plot, Gangapur, Jaipur..."><button onclick="filterAll()">Search</button></div>
<div style="display:flex;gap:8px"><div onclick="openLogin()" style="cursor:pointer">👤</div><div onclick="openAbout()" style="cursor:pointer">ℹ️</div><div onclick="openSet()" style="cursor:pointer">⚙️</div></div>
</div>

<div class="bar">Legal team with us for any Dispute and solution - <a href="https://lineslegal.com" target="_blank">Lineslegal.com</a> | Platform: 9784664741 | Insta FB X YT Google se Powerful</div>

<div class="chips">
<div class="chip" onclick="setS('All')">All</div>
<div class="chip" onclick="setS('Gangapur City')">Gangapur City</div>
<div class="chip" onclick="setS('Sawai Madhopur')">Sawai Madhopur</div>
<div class="chip" onclick="setS('Jaipur')">Jaipur</div>
<div class="chip" onclick="setS('Plot')">Plot</div>
</div>
